<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1680" viewBox="0 0 1200 840" role="img" aria-label="借道商家会话的请求时序：主进程经页面发请求，token 不跨进程，主进程用 generation 丢弃迟到结果">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#F7F9FC"/>
  <text x="60" y="58" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1F2937">借道商家会话：请求在页面里发</text>
  <text x="60" y="92" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="16" fill="#5B6B7C">token 不跨进程；主进程只收 status / text，并用 generation 丢弃迟到结果</text>

  <!-- actors -->
  <rect x="90" y="120" width="250" height="64" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="215" y="149" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="middle">主进程</text>
  <text x="215" y="171" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#5B6B7C" text-anchor="middle">MerchantApiClient</text>

  <rect x="475" y="120" width="290" height="64" rx="10" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.5"/>
  <text x="620" y="149" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="middle">商家页面</text>
  <text x="620" y="171" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#5B6B7C" text-anchor="middle">WebContentsView · 页面内脚本</text>

  <rect x="860" y="120" width="250" height="64" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
  <text x="985" y="149" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="middle">商家网关</text>
  <text x="985" y="171" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#5B6B7C" text-anchor="middle">商家 Web API</text>

  <!-- lifelines -->
  <line x1="215" y1="184" x2="215" y2="730" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="620" y1="184" x2="620" y2="730" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="985" y1="184" x2="985" y2="730" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- messages -->
  <line x1="215" y1="235" x2="465" y2="235" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="340" y="226" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" text-anchor="middle">executeJavaScript(script)</text>

  <path d="M 620 285 L 690 285 L 690 310 L 628 310" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="292" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937">校验 origin / 身份 / token 存在</text>

  <path d="M 620 355 L 690 355 L 690 380 L 628 380" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="362" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937">读取 ACCESS_TOKEN / tenant</text>

  <line x1="620" y1="430" x2="975" y2="430" stroke="#0891B2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="797" y="421" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" text-anchor="middle">fetch(path, Authorization: Bearer …)</text>

  <line x1="985" y1="480" x2="630" y2="480" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="807" y="471" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#5B6B7C" text-anchor="middle">status + text</text>

  <line x1="475" y1="535" x2="225" y2="535" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="350" y="526" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#5B6B7C" text-anchor="middle">{ status, text }</text>
  <text x="350" y="552" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#0891B2" text-anchor="middle">token 留在页面内</text>

  <path d="M 215 590 L 155 590 L 155 615 L 207 615" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="605" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937">assertSessionCurrent(generation)</text>

  <!-- alt frame -->
  <rect x="70" y="645" width="1060" height="120" rx="8" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,3"/>
  <rect x="70" y="645" width="58" height="24" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="99" y="662" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">alt</text>

  <line x1="70" y1="705" x2="1130" y2="705" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="90" y="685" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#047857">generation 未变</text>
  <text x="230" y="685" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#3F4B5B">→ 采用结果，继续业务</text>
  <text x="90" y="735" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#B91C1C">generation 变了</text>
  <text x="230" y="735" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#3F4B5B">→ 丢弃迟到结果，返回 SESSION_CHANGED</text>

  <!-- invalidation note -->
  <rect x="70" y="780" width="1060" height="38" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="90" y="805" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#B91C1C">失效触发：整页导航 / 视图销毁 / 切商家 → generation++，并 abort 页面内所有在途请求</text>
</svg>
